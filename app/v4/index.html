<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منظومة المكتبة والقرطاسية</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/v4/v4.css">
</head>
<body class="v4 ui-lg th-green">

<div id="app">
  <aside id="rail">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="20" y="30" width="20" height="62" rx="3" fill="currentColor"/>
        <rect x="45" y="22" width="18" height="70" rx="3" fill="currentColor" opacity=".7"/>
        <rect x="69" y="32" width="18" height="60" rx="3" fill="currentColor" opacity=".46"
              transform="rotate(13 78 92)"/>
        <rect x="14" y="92" width="92" height="7" rx="3.5" fill="currentColor"/>
      </svg>
      <div class="brand-txt">
        <h1 id="brandName">المكتبة والقرطاسية</h1>
        <div class="sub">نظام بيع ومخزون — يعمل بدون إنترنت</div>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="rail-foot">
      <span id="userChip"></span>
      <span id="ver">4.0</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="page-title" id="pageTitle"></div>
      <span class="branch-tag" id="branchTag"></span>
      <span class="demo-tag" id="demoTag" hidden>نسخة تجربة</span>
      <div class="spacer"></div>
      <span id="syncChip"></span>
      <div class="clock" id="clock"></div>
      <button class="btn ghost sm" id="logoutBtn" onclick="V4.logout()" hidden>خروج</button>
      <button class="btn primary" onclick="location.hash='#/pos'">بيع جديد <span class="small">F2</span></button>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="toasts"></div>
<div id="modalHost"></div>
<div id="printArea"></div>

<!-- أدوات الواجهة العامة من 3.x (الأيقونات، النوافذ، التنبيهات، الجداول، الحقول) — بلا بياناتها -->
<script src="/js/core.js"></script>
<script src="/js/jsbarcode.js"></script>
<script src="/v4/v4.js"></script>
<script src="/v4/home.js"></script>
<script src="/v4/pos.js"></script>
<script src="/v4/items.js"></script>
<script src="/v4/people.js"></script>
<script src="/v4/consign.js"></script>
<script src="/v4/suppliers.js"></script>
<script src="/v4/closing.js"></script>
<script src="/v4/receive.js"></script>
<script src="/v4/labels.js"></script>
<script src="/v4/stock.js"></script>
<script src="/v4/alerts.js"></script>
<script src="/v4/count.js"></script>
<script src="/v4/sync.js"></script>
<script src="/v4/settings.js"></script>
<script>V4.boot();</script>
</body>
</html>
