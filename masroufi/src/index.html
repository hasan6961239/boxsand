<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <title>مصروفي</title>
  <meta name="description" content="مصاريفي، ديوني، ومرتباتي في مكان واحد">
  <meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0E0D" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مصروفي">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="preload" href="assets/fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-arabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script>/*THEME*/try{var l=JSON.parse(localStorage.getItem('look')||'null'),r=document.documentElement,d=l?l.dark:matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'dark':'light';if(l){r.style.setProperty('--accent',l.a);r.style.setProperty('--accent-2',l.b);r.style.setProperty('--accent-rgb',l.rgb);r.dataset.motion=l.motion;r.dataset.size=l.size}}catch(e){}</script>
  <script type="module" src="app.js?v=__VERSION__"></script>
</head>

  <div id="app">
