<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E62">
<title>مخزوني — منظومة المكتبة</title>
<link rel="manifest" href="manifest-stock.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="stock.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <b>مخزوني</b>
    <span id="fresh">—</span>
  </div>
  <button class="icon-btn" id="refreshBtn" onclick="Stock.refresh()" aria-label="تحديث">↻</button>
  <button class="icon-btn" onclick="Stock.settings()" aria-label="الإعدادات">⚙</button>
</header>

<div id="searchBar" hidden>
  <input class="inp" id="q" type="search" placeholder="ابحث باسم الصنف أو الباركود…"
         autocomplete="off" oninput="Stock.setQ(this.value)">
</div>

<nav id="places" hidden></nav>

<main id="view"></main>

<div id="toasts"></div>
<div id="sheet" hidden></div>

<script src="stock.js"></script>
<script>Stock.boot();</script>
</body>
</html>
