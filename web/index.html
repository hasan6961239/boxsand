<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E62">
<title>تسجيل الكتب — منظومة المكتبة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <b>تسجيل الكتب</b>
    <span id="shopName"></span>
  </div>
  <button class="icon-btn" onclick="UI.go('settings')" aria-label="الإعدادات">⚙</button>
</header>

<nav id="tabs">
  <button data-tab="add" class="on" onclick="UI.go('add')">إضافة كتاب</button>
  <button data-tab="list" onclick="UI.go('list')">القائمة <span class="count" id="listCount" hidden></span></button>
  <button data-tab="settings" onclick="UI.go('settings')">الإعدادات</button>
</nav>

<main id="view"></main>

<div id="toasts"></div>
<div id="sheet" hidden></div>

<script src="app.js"></script>
<script src="ui.js"></script>
<script>App.boot();</script>
</body>
</html>
