name: Collect rates

# GitHub heavily throttles frequent cron schedules: a '*/10' schedule on this
# repository actually fired every four to seven HOURS, not every ten minutes.
# Hourly schedules are honoured far more reliably, so the trigger is hourly and
# each run then collects on a loop for most of that hour. That restores the
# ten-minute cadence without depending on the scheduler firing often.
#
# Scheduled workflows only run on the DEFAULT branch.
on:
  schedule:
    # Off the top of the hour — that minute is the most contended.
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collect-rates.yml'

permissions:
  contents: write

# One collector at a time. A run queued while another is looping starts as soon
# as that one ends, which is what keeps coverage continuous.
concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      LOOP_MINUTES: 52
      INTERVAL_SECONDS: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect and publish on a loop
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Take whatever is on the branch now, including collector changes
          # pushed since this run started — otherwise a fix waits out the whole
          # loop before it takes effect.
          sync_to_origin() {
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git checkout -f -- . 2>/dev/null || true
            git fetch -q origin "$BRANCH" || return 1
            git checkout -q -B "$BRANCH" "origin/$BRANCH" || return 1
            git reset --hard -q "origin/$BRANCH" || return 1
          }

          publish_once() {
            node collector/collect.mjs || return 1
            if git diff --quiet -- docs/data; then
              echo "No change in docs/data — nothing to commit."
              return 0
            fi
            git add docs/data || return 1
            git commit -q -m "data: rates at $(date -u '+%Y-%m-%d %H:%M UTC')" || return 1
            git push
          }

          publish() {
            for attempt in 1 2 3; do
              if publish_once; then
                return 0
              fi
              echo "Attempt $attempt failed — resetting to origin and collecting again."
              # docs/data is generated output, never something to merge. If another
              # run published first, throw this attempt away, take what landed, and
              # re-collect on top of it.
              sync_to_origin || true
              sleep $((attempt * 4))
            done
            return 1
          }

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          round=0
          consecutive_failures=0

          while :; do
            round=$(( round + 1 ))
            echo "::group::Collection $round"
            [ "$round" -gt 1 ] && sync_to_origin
            if publish; then
              consecutive_failures=0
            else
              consecutive_failures=$(( consecutive_failures + 1 ))
              echo "::warning::Collection $round could not be published."
            fi
            echo "::endgroup::"

            # Repeated failures mean something is actually broken, not a race.
            if [ "$consecutive_failures" -ge 3 ]; then
              echo "::error::Three consecutive collections failed — stopping early."
              exit 1
            fi

            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            if [ "$remaining" -lt "$INTERVAL_SECONDS" ]; then
              sleep "$remaining"
            else
              sleep "$INTERVAL_SECONDS"
            fi
          done

          echo "Finished after $round collections."
