name: Collect rates

# GitHub only runs scheduled workflows on the repository's DEFAULT branch, so
# this file has to be merged into it before the schedule starts firing.
# The cron is best-effort: GitHub queues scheduled jobs and can delay them under
# load, which is why the page also refreshes gold spot in the browser.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collect-rates.yml'

permissions:
  contents: write

# Never let two collections write the history file at the same time.
concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect and publish
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            node collector/collect.mjs || return 1
            if git diff --quiet -- docs/data; then
              echo "No change in docs/data — nothing to commit."
              return 0
            fi
            git add docs/data || return 1
            git commit -q -m "data: rates at $(date -u '+%Y-%m-%d %H:%M UTC')" || return 1
            git push
          }

          for attempt in 1 2 3 4; do
            if publish; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed — resetting to origin and collecting again."
            # docs/data is generated output, never something to merge. If another
            # run published first, throw this attempt away, take what landed, and
            # re-collect on top of it: rebasing here just produces a conflict that
            # leaves a detached HEAD and wedges every later attempt.
            git rebase --abort 2>/dev/null || true
            git merge  --abort 2>/dev/null || true
            git checkout -f -- . 2>/dev/null || true
            git fetch -q origin "$BRANCH" || true
            git checkout -q -B "$BRANCH" "origin/$BRANCH" || true
            git reset --hard -q "origin/$BRANCH" || true
            sleep $((attempt * 4))
          done

          echo "::error::Could not publish collected data after 4 attempts."
          exit 1
