name: Diagnose sources

# Manual only. Prints what each rate page actually publishes around the city
# names so the extraction rules can be tuned against the live markup.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node collector/diagnose.mjs
