# ============================================================
#  الاختبار التلقائي — مع كل تعديل يُرفع للمستودع
#  ------------------------------------------------------------
#  لينكس: كل الاختبارات (مولّد البيانات، قاعدة البيانات، الواجهة،
#         الحسابات، تطبيق التلفون)، ثم بناء ملف التثبيت ورفعه للتحميل.
#  ويندوز: build.bat نفسه بمترجم ويندوز المدمج — يكشف أي كود لا يقبله
#          (قرار 0002: الكود يبقى مقبولاً منه). واختبارات القاعدة على
#          ملفي sqlite3.dll اللذين يُشحنان (64 و32 بت)، مع اختبار القتل.
#  مجاني للمستودع العام.
# ============================================================
name: الاختبارات

on:
  push:
    branches: [claude/tripoli-foundation, claude/app-review-improvements-ld9q5d]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: لينكس — الاختبارات والبناء
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: الأدوات (mono وnsis)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs mono-devel libmono-system-windows-forms4.0-cil \
            libmono-system-drawing4.0-cil nsis fonts-dejavu-core xvfb xauth

      - name: playwright-core وChromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          echo "CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: مولّد بيانات التجربة
        run: node tools/gen/test-gen.js

      - name: قاعدة البيانات (المرحلة 1)
        run: |
          tools/build-dbtests.sh
          mono build/DbTests.exe
          mono build/DbTests.exe crash 300
          mono build/DbTests.exe crash 100 --migrate

      - name: نقل بيانات 3.x (مكتبات المولّد بصيغة store.json)
        run: |
          node tools/gen/generate.js --profile misrata --store3 1 --out /tmp/s3m
          node tools/gen/generate.js --profile tripoli --store3 1 --out /tmp/s3t
          mono build/DbTests.exe import /tmp/s3m/store3.json
          mono build/DbTests.exe import /tmp/s3t/store3.json

      - name: المحرك الحقيقي من البداية للنهاية (المرحلة 2)
        run: node tools/test-engine.js

      - name: واجهة 4.0 على المحرك الحقيقي (المرحلة 4)
        env:
          SHOTS: shots-v4
        run: node tools/test-v4.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-screens
          path: shots-v4
          retention-days: 14

      - name: الواجهة والحسابات
        run: |
          node tools/dev-server.js > dev-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:17845/ && break; sleep 0.5; done
          node tools/test.js
          node tools/test-money.js

      - name: تطبيق التلفون
        run: node tools/test-site.js

      - name: البناء
        run: tools/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Qirtasiya-Setup
          path: build/Qirtasiya-Setup-*.exe
          retention-days: 14

  windows:
    name: ويندوز — build.bat وقاعدة البيانات
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build.bat بمترجم ويندوز المدمج
        shell: cmd
        run: |
          call build.bat < NUL
          if not exist build\Qirtasiya-1.exe exit /b 1
          if not exist build\x64\sqlite3.dll exit /b 1
          if not exist build\x86\sqlite3.dll exit /b 1
          if not exist build\Microsoft.Web.WebView2.Core.dll exit /b 1
          if not exist build\Microsoft.Web.WebView2.WinForms.dll exit /b 1
          if not exist build\x64\WebView2Loader.dll exit /b 1
          if not exist build\x86\WebView2Loader.dll exit /b 1

      - name: البرنامج نفسه على ويندوز — نافذته بـ WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'build\data\log.txt'
          New-Item -ItemType Directory -Force build\data | Out-Null
          $p = Start-Process -FilePath build\Qirtasiya-1.exe -PassThru
          $port = $null
          for ($i = 0; $i -lt 120 -and -not $port; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path build\data\port.txt) { $port = (Get-Content build\data\port.txt -Raw).Trim() }
          }
          if (-not $port) { Get-Content $log -ErrorAction SilentlyContinue; throw 'البرنامج لم يبدأ' }
          $seen = $false
          for ($i = 0; $i -lt 60 -and -not $seen; $i++) {
            Start-Sleep -Milliseconds 500
            $seen = Select-String -Path $log -Pattern 'نافذة البرنامج: WebView2' -Quiet
          }
          # فتحه مرة ثانية يعيد النافذة نفسها، والنسخة الثانية تخرج
          $p2 = Start-Process -FilePath build\Qirtasiya-1.exe -PassThru
          $p2.WaitForExit(30000) | Out-Null
          Start-Sleep -Seconds 2
          $again = Select-String -Path $log -Pattern 'أُعيدت النافذة نفسها' -Quiet
          # واجهة 4.0 مدمجة في الملف التنفيذي كما بناه build.bat
          $v4 = 0
          foreach ($f in 'v4/index.html', 'v4/v4.js', 'v4/pos.js', 'v4/settings.js') {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/$f"
              if ($r.StatusCode -eq 200 -and $r.Content.Length -gt 100) { $v4++ }
            } catch { Write-Host "غير موجود: $f" }
          }
          $h = @{ 'X-Qirtasiya' = '1' }
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/quit" -Headers $h -Body '{}' -ContentType 'application/json' | Out-Null
          $p.WaitForExit(30000) | Out-Null
          Get-Content $log
          if (-not $seen) { throw 'النافذة لم تُفتح بـ WebView2' }
          if (-not $again) { throw 'فتحه مرة ثانية لم يُعد النافذة نفسها' }
          if (-not $p.HasExited) { throw 'البرنامج لم يخرج بعد /api/quit' }
          if ($v4 -ne 4) { throw 'ملفات واجهة 4.0 ليست كلها داخل الملف التنفيذي' }

      - name: قاعدة البيانات بملفي sqlite3.dll اللذين يُشحنان
        shell: cmd
        run: |
          call tools\build-dbtests.bat || exit /b 1
          build\DbTests.exe || exit /b 1
          build\DbTests32.exe || exit /b 1
          build\DbTests.exe crash 150 || exit /b 1
          build\DbTests.exe crash 60 --migrate || exit /b 1
