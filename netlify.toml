# ============================================================
#  رفع موقع المخزون من جذر المستودع
#  ------------------------------------------------------------
#  الموقع في مجلد site/ وحده. هذا الملف يقول لـNetlify أن ينشر
#  ذلك المجلد لا المستودع كله — فلا يُرفع الكود المصدري ولا
#  أدوات البناء ولا بيانات التجربة.
#
#  ملف site/netlify.toml هو نظيره للحالة الأخرى: حين تُسحب
#  محتويات مجلد site وحدها إلى app.netlify.com/drop.
#  الترويستان أدناه يجب أن تبقيا مطابقتين لما فيه.
# ============================================================

[build]
  publish = "site"
  command = ""

# الصفحة تتصل بالـWorker الخاص بصاحب المحل وحده.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
