# ============================================================
#  رفع موقع المخزون من جذر المستودع
#  ------------------------------------------------------------
#  الموقع في مجلد site/ وحده. هذا الملف يقول لـNetlify أن ينشر
#  ذلك المجلد لا المستودع كله — فلا يُرفع الكود المصدري ولا
#  أدوات البناء ولا بيانات التجربة.
#
#  ملف site/netlify.toml هو نظيره للحالة الأخرى: حين تُسحب
#  محتويات مجلد site وحدها إلى app.netlify.com/drop.
#  الترويستان أدناه يجب أن تبقيا مطابقتين لما فيه.
# ============================================================

[build]
  publish = "site"
  command = ""

# الصفحة تتصل بالـWorker الخاص بصاحب المحل وحده.
# الكاميرا للموقع نفسه فقط (مسح الباركود في الآيفون)، و'wasm-unsafe-eval'
# يسمح بتشغيل قارئ الباركود المبنيّ WebAssembly من ملفات الموقع وحدها —
# لا يسمح بأي سكربت سطري ولا eval.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# قارئ الباركود: نوعه الصحيح يجعل الآيفون يجهّزه أثناء التحميل
[[headers]]
  for = "/vendor/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
