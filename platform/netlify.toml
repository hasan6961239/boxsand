# ═════════════════════════════════════════════════════════════════════════════
#  سُفرة — إعدادات النشر على Netlify
#
#  ⚠ خطوة يدوية واحدة إلزامية قبل أي شيء:
#     Netlify ← Site configuration ← Build & deploy ← Base directory = platform
#
#  السبب: Netlify تقرأ netlify.toml من جذر المستودع افتراضياً، وجذر هذا
#  المستودع يحتوي مشروعاً آخر بملف إعدادات خاص به. تحديد المجلد الأساسي هو ما
#  يجعل Netlify تقرأ هذا الملف بدل ذاك. كل المسارات أدناه نسبية إليه.
# ═════════════════════════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# يحوّل بناء Next.js إلى دوال ومحتوى ثابت على شبكة Netlify.
# تُثبَّت الإضافة تلقائياً من هذا التصريح؛ لا حاجة لإضافتها إلى package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── التخزين المؤقت ──────────────────────────────────────────────────────────
# ملفات ذات أسماء ثابتة لا يتغيّر محتواها أبداً: خزّنها سنة كاملة.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# صور العرض التجريبي — ثابتة كذلك.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── ملاحظات ─────────────────────────────────────────────────────────────────
# • ترويسات الأمان (nosniff، Referrer-Policy، X-Frame-Options، Permissions-Policy)
#   تُضبط في next.config.ts لتسري على استجابات الخادم أيضاً لا على الملفات الثابتة فقط.
# • لا حاجة إلى [[redirects]] ولا إلى إعداد SPA: موجّه Next.js يتكفّل بالمسارات،
#   والإضافة تُنشئ الدوال اللازمة تلقائياً.
# • المتغيّرات تُضاف من واجهة Netlify لا من هذا الملف — انظر .env.example.
